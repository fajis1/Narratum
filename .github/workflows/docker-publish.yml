name: Create and publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      use_latest_tag:
        description: 'Tag as latest instead of branch name'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      web_image_name: ${{ steps.image-name.outputs.web_image_name }}
      web_legacy_image_name: ${{ steps.image-name.outputs.web_legacy_image_name }}
      web_cuda_image_name: ${{ steps.image-name.outputs.web_cuda_image_name }}
      compute_worker_image_name: ${{ steps.image-name.outputs.compute_worker_image_name }}
      compute_worker_cuda_image_name: ${{ steps.image-name.outputs.compute_worker_cuda_image_name }}
    steps:
      - name: Compute Docker image names
        id: image-name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "web_image_name=${owner}/openreader" >> "$GITHUB_OUTPUT"
          echo "web_legacy_image_name=${owner}/openreader-webui" >> "$GITHUB_OUTPUT"
          echo "web_cuda_image_name=${owner}/openreader-cuda" >> "$GITHUB_OUTPUT"
          echo "compute_worker_image_name=${owner}/openreader-compute-worker" >> "$GITHUB_OUTPUT"
          echo "compute_worker_cuda_image_name=${owner}/openreader-compute-worker-cuda" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: write
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_target: web
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            context: .
            dockerfile: ./Dockerfile
            target: final
            onnxruntime_cuda: skip
          - image_target: web
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            context: .
            dockerfile: ./Dockerfile
            target: final
            onnxruntime_cuda: skip
          - image_target: web-cuda
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            context: .
            dockerfile: ./Dockerfile
            target: runner-cuda
            onnxruntime_cuda: v11
          - image_target: compute-worker
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            context: .
            dockerfile: ./compute/worker/Dockerfile
            target: ""
            onnxruntime_cuda: skip
          - image_target: compute-worker
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            context: .
            dockerfile: ./compute/worker/Dockerfile
            target: ""
            onnxruntime_cuda: skip
          - image_target: compute-worker-cuda
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            context: .
            dockerfile: ./compute/worker/Dockerfile.gpu
            target: ""
            onnxruntime_cuda: v11

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Configure trusted Docker Hub cache
        run: bash scripts/ci-configure-docker-mirror.sh

      - name: Retrieve BuildKit with bounded retries
        run: |
          bash scripts/ci-docker-pull-with-retry.sh moby/buildkit:buildx-stable-1
          # Use the pulled digest so bootstrap reuses the verified local image.
          image=$(docker image inspect moby/buildkit:buildx-stable-1 --format '{{index .RepoDigests 0}}')
          echo "CI_BUILDKIT_IMAGE=${image}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=${{ env.CI_BUILDKIT_IMAGE }}
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Login to GitHub Container Registry (attempt 1)
        id: ghcr_login_1
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait before registry login retry
        if: steps.ghcr_login_1.outcome == 'failure'
        run: sleep 10

      - name: Login to GitHub Container Registry (attempt 2)
        id: ghcr_login_2
        if: steps.ghcr_login_1.outcome == 'failure'
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait before final registry login retry
        if: steps.ghcr_login_1.outcome == 'failure' && steps.ghcr_login_2.outcome == 'failure'
        run: sleep 20

      - name: Login to GitHub Container Registry (attempt 3)
        if: steps.ghcr_login_1.outcome == 'failure' && steps.ghcr_login_2.outcome == 'failure'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select image name
        id: image
        run: |
          case "${{ matrix.image_target }}" in
            web) echo "image_name=${{ needs.prepare.outputs.web_image_name }}" >> "$GITHUB_OUTPUT" ;;
            web-cuda) echo "image_name=${{ needs.prepare.outputs.web_cuda_image_name }}" >> "$GITHUB_OUTPUT" ;;
            compute-worker-cuda) echo "image_name=${{ needs.prepare.outputs.compute_worker_cuda_image_name }}" >> "$GITHUB_OUTPUT" ;;
            *) echo "image_name=${{ needs.prepare.outputs.compute_worker_image_name }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build and push Docker image (${{ matrix.image_target }} / ${{ matrix.arch }}, attempt 1)
        id: build_1
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: |
            ONNXRUNTIME_NODE_INSTALL_CUDA=${{ matrix.onnxruntime_cuda }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.image_target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_target }}-${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.image.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true

      - name: Wait before build retry 2
        if: steps.build_1.outcome == 'failure'
        run: sleep 30

      - name: Build and push Docker image (${{ matrix.image_target }} / ${{ matrix.arch }}, attempt 2)
        if: steps.build_1.outcome == 'failure'
        id: build_2
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: |
            ONNXRUNTIME_NODE_INSTALL_CUDA=${{ matrix.onnxruntime_cuda }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.image_target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_target }}-${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.image.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true

      - name: Wait before build retry 3
        if: steps.build_1.outcome == 'failure' && steps.build_2.outcome == 'failure'
        run: sleep 60

      - name: Build and push Docker image (${{ matrix.image_target }} / ${{ matrix.arch }}, attempt 3)
        if: steps.build_1.outcome == 'failure' && steps.build_2.outcome == 'failure'
        id: build_3
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: |
            ONNXRUNTIME_NODE_INSTALL_CUDA=${{ matrix.onnxruntime_cuda }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.image_target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_target }}-${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.image.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.image_target }}
          digest="${{ (steps.build_1.outcome == 'success' && steps.build_1.outputs.digest) || (steps.build_2.outcome == 'success' && steps.build_2.outputs.digest) || steps.build_3.outputs.digest }}"
          test -n "$digest"
          touch "/tmp/digests/${{ matrix.image_target }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image_target }}--${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.image_target }}
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_target: web
            runner: ubuntu-24.04
          - image_target: web-cuda
            runner: ubuntu-24.04
          - image_target: compute-worker
            runner: ubuntu-24.04
          - image_target: compute-worker-cuda
            runner: ubuntu-24.04

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests/${{ matrix.image_target }}
          pattern: digests-${{ matrix.image_target }}--*
          merge-multiple: true

      - name: Validate architecture digests
        working-directory: /tmp/digests/${{ matrix.image_target }}
        run: |
          case "${{ matrix.image_target }}" in
            web|compute-worker) expected=2 ;;
            *) expected=1 ;;
          esac
          actual="$(find . -maxdepth 1 -type f | wc -l)"
          if [ "${actual}" -ne "${expected}" ]; then
            echo "::error::Expected ${expected} architecture digest(s) for ${{ matrix.image_target }}, found ${actual}; refusing to publish an incomplete image"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Login to GitHub Container Registry (attempt 1)
        id: ghcr_login_1
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait before registry login retry
        if: steps.ghcr_login_1.outcome == 'failure'
        run: sleep 10

      - name: Login to GitHub Container Registry (attempt 2)
        id: ghcr_login_2
        if: steps.ghcr_login_1.outcome == 'failure'
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait before final registry login retry
        if: steps.ghcr_login_1.outcome == 'failure' && steps.ghcr_login_2.outcome == 'failure'
        run: sleep 20

      - name: Login to GitHub Container Registry (attempt 3)
        if: steps.ghcr_login_1.outcome == 'failure' && steps.ghcr_login_2.outcome == 'failure'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select image names
        id: image
        run: |
          case "${{ matrix.image_target }}" in
            web)
              echo "image_name=${{ needs.prepare.outputs.web_image_name }}" >> "$GITHUB_OUTPUT"
              echo "metadata_images<<EOF" >> "$GITHUB_OUTPUT"
              echo "${{ env.REGISTRY }}/${{ needs.prepare.outputs.web_image_name }}" >> "$GITHUB_OUTPUT"
              echo "${{ env.REGISTRY }}/${{ needs.prepare.outputs.web_legacy_image_name }}" >> "$GITHUB_OUTPUT"
              echo "EOF" >> "$GITHUB_OUTPUT"
              ;;
            web-cuda)
              echo "image_name=${{ needs.prepare.outputs.web_cuda_image_name }}" >> "$GITHUB_OUTPUT"
              echo "metadata_images=${{ env.REGISTRY }}/${{ needs.prepare.outputs.web_cuda_image_name }}" >> "$GITHUB_OUTPUT"
              ;;
            compute-worker-cuda)
              echo "image_name=${{ needs.prepare.outputs.compute_worker_cuda_image_name }}" >> "$GITHUB_OUTPUT"
              echo "metadata_images=${{ env.REGISTRY }}/${{ needs.prepare.outputs.compute_worker_cuda_image_name }}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "image_name=${{ needs.prepare.outputs.compute_worker_image_name }}" >> "$GITHUB_OUTPUT"
              echo "metadata_images=${{ env.REGISTRY }}/${{ needs.prepare.outputs.compute_worker_image_name }}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.metadata_images }}
          tags: |
            type=raw,value=latest,enable=${{ (github.event_name == 'push' && !contains(github.ref, '-pre')) || (github.event_name == 'workflow_dispatch' && inputs.use_latest_tag == true) }},priority=1000
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && inputs.use_latest_tag != true }}

      - name: Create manifest list and push
        working-directory: /tmp/digests/${{ matrix.image_target }}
        run: |
          docker buildx imagetools create \
            $(echo "$TAGS" | xargs -I {} echo -t {}) \
            $(printf '${{ env.REGISTRY }}/${{ steps.image.outputs.image_name }}@sha256:%s ' *)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

      - name: Output build information
        run: |
          echo "✅ Docker image built and pushed successfully!"
          echo "🐋 Target: ${{ matrix.image_target }}"
          echo "🐋 Images:"
          echo '${{ steps.meta.outputs.tags }}' | sed 's/^/  - /'
          echo "📝 Event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "📝 Triggered by manual workflow dispatch on branch: ${{ github.ref_name }}"
            echo "📝 use_latest_tag: ${{ inputs.use_latest_tag }}"
          else
            echo "📝 Triggered by tag: ${{ github.ref_name }}"
          fi
