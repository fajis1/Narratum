name: Vitest Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest-testing:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.12'
      # This deterministic fixture mocks extraction/wordfreq/providers and needs
      # only Python's standard library, not production OCR/model dependencies.
      - name: Verify deterministic OCR fixture
        run: python -I -S tests/fixtures/ocr_source_recovery.py > /tmp/ocr-fixture.json
      - uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: bash scripts/ci-install-with-retry.sh --frozen-lockfile
      - name: Apply drizzle migrations (SQLite)
        run: pnpm migrate
      - name: Run Vitest suites
        env:
          NARRATUM_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: pnpm test:unit
