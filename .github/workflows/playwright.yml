name: Playwright Tests
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs-site/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'docs-site/**'
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-testing:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      USE_EMBEDDED_WEED_MINI: true
      ENABLE_TEST_NAMESPACE: true
      BASE_URL: http://127.0.0.1:3003
      AUTH_SECRET: ci-auth-secret-change-me
      USE_ANONYMOUS_AUTH_SESSIONS: true
      S3_ENDPOINT: http://127.0.0.1:8333
    steps:
    - uses: actions/checkout@v5
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
        cache: pnpm
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libreoffice-writer ffmpeg python3-venv
    - name: Install Python worker dependencies
      run: |
        python3 -m venv .venv
        .venv/bin/pip install --disable-pip-version-check nats-py google-genai pypdf nltk
    - name: Restore pinned SeaweedFS binary
      id: weed-cache
      uses: actions/cache@v5
      with:
        path: /tmp/ci-seaweedfs
        key: seaweedfs-4.18-${{ runner.os }}-${{ runner.arch }}-v1
    - name: Configure trusted Docker Hub cache
      if: steps.weed-cache.outputs.cache-hit != 'true'
      run: bash scripts/ci-configure-docker-mirror.sh
    - name: Retrieve pinned SeaweedFS binary
      if: steps.weed-cache.outputs.cache-hit != 'true'
      run: |
        bash scripts/ci-docker-pull-with-retry.sh chrislusf/seaweedfs:4.18
        WEED_PATH=$(docker run --pull=never --rm --entrypoint sh chrislusf/seaweedfs:4.18 -lc 'command -v weed')
        CID=$(docker create --pull=never chrislusf/seaweedfs:4.18)
        trap 'docker rm -f "$CID"' EXIT
        mkdir -p /tmp/ci-seaweedfs
        docker cp "${CID}:${WEED_PATH}" /tmp/ci-seaweedfs/weed
        docker rm "${CID}"
        trap - EXIT
    - name: Install and verify SeaweedFS version
      run: |
        sudo install -m 0755 /tmp/ci-seaweedfs/weed /usr/local/bin/weed
        weed version | tee /tmp/weed-version.txt
        grep -Eq '(^|[^0-9])4\.18([^0-9]|$)' /tmp/weed-version.txt
    - name: Install NATS server binary
      run: |
        curl --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 120 -fsSL -o /tmp/nats-server.tar.gz \
          https://github.com/nats-io/nats-server/releases/download/v2.12.1/nats-server-v2.12.1-linux-amd64.tar.gz
        tar -xzf /tmp/nats-server.tar.gz -C /tmp
        sudo install -m 0755 /tmp/nats-server-v2.12.1-linux-amd64/nats-server /usr/local/bin/nats-server
        nats-server -v
    - name: Install dependencies
      run: bash scripts/ci-install-with-retry.sh --frozen-lockfile
    - name: Restore PP-DocLayout model cache
      uses: actions/cache@v5
      with:
        path: docstore/model
        key: pp-doclayoutv3-${{ runner.os }}-${{ hashFiles('compute/core/src/pdf/assets/manifest.json') }}
    - name: Prepare PP-DocLayout model
      run: pnpm exec tsx scripts/prepare-pdf-layout-model.ts
    - name: Apply drizzle migrations (SQLite)
      run: pnpm migrate
    - name: Build app and enforce bundle guard
      run: |
        pnpm build
        pnpm build:bundle-guard
    - name: Verify ffprobe
      run: ffprobe -version
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
    - name: Run Playwright tests
      env:
        API_BASE: http://localhost:3005
        API_KEY: test
      run: pnpm exec playwright test --max-failures=5 --reporter=list,github,html
    - uses: actions/upload-artifact@v7
      if: ${{ failure() || cancelled() }}
      with:
        name: playwright-report
        path: |
          playwright-report/
          tests/results/
        retention-days: 7
